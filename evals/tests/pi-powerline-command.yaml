id: pi-powerline-command
suite: pi-extensions
description: Verify the /powerline command from pi-powerline is registered in the current Pi setup.
agents:
  include: [pi-current]
prompt: /powerline status
assert:
  - type: settingsDrivenSetup
  - type: exitCode
    equals: 0
  - type: notContains
    value: '"type":"agent_start"'
  - type: workspaceDiff
    changedFiles: []
