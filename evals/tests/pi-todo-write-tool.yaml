id: pi-todo-write-tool
suite: pi-extensions
description: Verify the todo_write tool from pi-todo-write works in the current Pi setup.
agents:
  include: [pi-current]
args:
  - --tools
  - todo_write
prompt: |
  This is an eval. Call the todo_write tool exactly once with one in_progress item whose content is "verify todo_write" and activeForm is "Verifying todo_write".
  After the tool result, reply exactly TODO_WRITE_OK.
assert:
  - type: settingsDrivenSetup
  - type: toolCalled
    name: todo_write
    min: 1
  - type: contains
    value: TODO_WRITE_OK
  - type: noToolErrors
  - type: workspaceDiff
    changedFiles: []
